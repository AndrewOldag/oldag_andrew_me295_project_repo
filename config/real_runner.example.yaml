# Template for private/real_runner.yaml, read by measure/real_runner.py (RealRunner).
# Copy to private/real_runner.yaml and fill in. Keep the real file out of git.
host: <ssh host alias of the compute host>
work_dir: <folder there for tracker outputs of this task>
code_dir: <folder there for a copy of measure/ and scripts/remote/>
tracker_code: <tracker checkout there with the stage-tracking loader (branch gate2-windowed-coupling or later)>
python: <Python of the tracker environment there (envs/qb.yml)>
min_free_gb: 21                 # do not start a run below this free space on the work disk
midline_weights: <net2 weights for batch_midlines.py (path, or a name under cascade/weights); default net2_midline_ft.pt>
midline_tag: <short tag added to every net-midline, moved-copy and track name, e.g. ft2; optional>
windows:                        # window id <root>__w<from_h>-<to_h> -> movie folder and midline file there
  <root_id>__w4-6:
    imgdir: <montage .imgdir of the root>
    midline: <midline file for the window (net midline, midline_ml/batch_midlines.py tile mode)>
  <root_id>__w6-8:              # no midline entry: built on the host into <work_dir>/midline/ before tracking
    imgdir: <montage .imgdir of the root>
# Cluster compute (spec 2026-11-04): replaces host/code_dir/python above; work_dir is then the folder on storage_host
# compute: cluster
# storage_host: <ssh host alias of the storage host; relays to the cluster>
# ledger: [<python>, <spend-ledger script>]       # check before every submit
# cache: staging/c026/tracks                     # local track cache of its own (repo-relative; optional)
# spend_stop_usd: 12                               # refuse a submit once the projected total reaches this (c026)
# cluster:
#   alias: <cluster alias in the storage host's ssh config (connection master)>
#   work_dir: <cluster folder for this task>        # tracks, logs, DELETED.log
#   stage_dir: <cluster folder for staged root imgdirs>
#   cap_mb: 35840                                   # cap of cap_dir (default: work_dir) checked before staging
#   cap_dir: <the whole cluster folder>
#   one_staged_root: true                           # clear the other staged roots first (c026)
#   storage_work: <same as work_dir above>           # where clear_root checks the tracks' md5
#   code_dir, tracker_code, env, cpu_partition, gpu_partition, gpu_gres, midline_weights, max_jobs
