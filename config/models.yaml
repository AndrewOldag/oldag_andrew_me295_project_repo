# Pinned settings for the LLM agents. Agents run through the Claude Code CLI.
# Change only with a dated entry in docs/decisions.md.
# The checker has no LLM and does not read this file.

model: claude-opus-5-5          # pinned 2026-10-08. Exact ID, no alias
claude_code_version: 2.1.293    # pinned 2026-10-09. The launcher refuses any other version

# One agent step is one `claude -p` call that returns one action.
# max_turns: CLI turns per call (the structured-output tool uses one).
# step_limit: actions per task before the orchestrator stops it.
agents:
  dispatcher:
    effort: medium
    max_turns: 3
    step_limit: 4
  diagnostician:
    effort: high
    max_turns: 3
    step_limit: 8
  auditor:
    effort: high
    max_turns: 3
    step_limit: 30
