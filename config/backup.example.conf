# scripts/ops settings (backup, heartbeat, scheduler). Copy to private/backup.conf
# and fill in. Shell syntax: KEY=value, no spaces around =. Paths may be in Windows or Git Bash form.

# Lab server: ssh host alias and backup root (relative to the remote home)
HOST=<ssh alias>
REMOTE_ROOT=<backup folder>

# Sources on the VM
COURSE_REPO=<main checkout of this repo>
PLANNING_CLONE=<planning clone>
RESEARCH_REPO=<tracker repo working tree>
# Research tarball members: "name=path ...", name is the path inside the archive
RESEARCH_ITEMS="<name>=<path> <name>=<path>"
HOME_CLAUDE=<home .claude folder>
CONDA=<conda executable>
ENVS="me295 qb"

# Local build folder (deleted after the server check passes)
STAGE=<folder outside every git repo>
MIN_FREE_GB=10

# Transfer (nothing on the server is ever deleted)
RATE_MB=40

# Scheduler (scripts/ops/install_schedule.ps1)
OPS_DIR=<folder outside the repo that holds the installed copies of scripts/ops>
HEARTBEAT_LOG=<VM health log>
BACKUP_LOG=<backup log>
BASH=<bash.exe>
