# Seeds of the five development faults (docs/proposals/2026-10-12_freeze-v2.md, section 1).
# Decided by Andrew on 2026-10-12 (spec docs/specs/2026-10-12_freeze-decisions-diagnostician-fixes.md).
# Seed 0: development only. Prompt changes P1-P5 were written from seed 0 traces; a seed 0 run is a check, not a score.
# Seeds 1-5: scoring. Seeds 3-5 are labelled by tracker-only runs before any prompt change.
development_seeds: [0]
scoring_seeds: [1, 2, 3, 4, 5]
# Freeze v3 (docs/proposals/2026-10-23_freeze-v3.md, approved by Andrew 2026-10-23). Seeds 0-5 are not used in v3.
# sizing: held-out sizes at v3 geometry; basis: clean basis check of thresholds and flank tolerance; scoring: the 51 rods.
v3:
  sizing_seeds: [10, 11, 12]
  basis_seeds: [10, 11, 12, 13, 14]
  scoring_seeds: [20, 21, 22]
