# Agents environment.
# Create:  conda env create -f environment.yml
# Update:  conda env update -f environment.yml --prune
name: me295
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - libblas=*=*openblas   # the MKL build crashed on matrix products on the Windows build machine (missing DLL entry point)
  - scipy
  - pyyaml
  - matplotlib-base   # result plots
  - pytest
  - pip
  - pip:
      - mcp==2.3.0   # only for scripts/cli_probe (MCP test record)
      - pypdf==6.21.4   # rag: PDF text per page (spec 2026-11-02 B)
      - fastembed==0.9.1   # rag: local CPU embeddings (ONNX, no torch)
